services:
  - type: web
    name: hydrowise-api
    env: docker
    plan: free
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    envVars:
      - key: HYDROWISE_ENV
        value: production
      - key: DEVICE_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hydrowise-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: WEATHER_API_BASE_URL
        value: ""
      - key: WEATHER_API_KEY
        value: ""
      - key: MODEL_ARTIFACT_PATH
        value: ""
      - key: MODEL_VERSION
        value: mock-v0.1

databases:
  - name: hydrowise-db
    databaseName: hydrowise
    user: hydrowise_user
    plan: free
