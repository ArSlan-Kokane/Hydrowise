services:
  - type: web
    name: hydrowise-api
    env: docker
    plan: free
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    envVars:
      - key: HYDROWISE_ENV
        value: production
      - key: DEVICE_API_KEY
        value: OvxiNrG7lFq7tLJzroQgedHSHZJOaRY4Tu+Sl0lou2I=
      - key: DATABASE_URL
        fromDatabase:
          name: hydrowise-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: WEATHER_API_BASE_URL
        value: ""
      - key: WEATHER_API_KEY
        value: ""
      - key: MODEL_ARTIFACT_PATH
        value: ml/models/model_blueprint.json
      - key: MODEL_VERSION
        value: AMHOE-v1.0-proprietary

databases:
  - name: hydrowise-db
    databaseName: hydrowise
    user: hydrowise_user
    plan: free
